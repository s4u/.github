#
# organization wide configuration for release-drafter
#

name-template: v$RESOLVED_VERSION
tag-template: v$RESOLVED_VERSION

categories:

  - title: ':boom: Breaking changes'
    when:
      label: 'breaking changes'

  - title: ':fire: New features'
    when:
      label: 'enhancement'

  - title: ':exclamation: Deprecated features'
    when:
      label: 'deprecation'

  - title: ':lady_beetle: Bug Fixes'
    when:
      label: 'bug'

  - title: ':hammer: Maintenance'
    when:
      labels:
        - 'code quality'
        - 'documentation'

  - title: ':toolbox: Dependency updates'
    exclusive: true
    when:
      label: 'dependencies'

  - type: 'pre-exclude'
    when:
      label: 'invalid'

change-template: '- $TITLE ($NUMBERS) @$AUTHOR'

# merge repeated dependency bumps into one entry
group-changes:
  - pattern: '/^Bump (?<group>.+?) from (?<from>\S+) to (?<to>\S+)(?<group_in> in .+)?$/'
    title-template: 'Bump $GROUP from $FIRST_FROM to $LAST_TO$GROUP_IN'

sort-direction: 'ascending'

exclude-contributors:
  - 'dependabot'
  - 'dependabot[bot]'
  - 'GitHub Action'
  - 'claude'

template: |
  # What's Changed

  $CHANGES

  # :heart: Thanks
  Many thanks for collaboration on this release for: $CONTRIBUTORS
