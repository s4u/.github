name: Pull requests

on:
  workflow_call:
    inputs:
      java-matrix:
        default: '["8", "11", "17", "21"]'
        required: false
        type: string

      java-default:
        default: '8'
        required: false
        type: string

      java-dist-matrix:
        default: '["zulu"]'
        required: false
        type: string

      java-dist-default:
        default: 'zulu'
        required: false
        type: string

      maven-matrix:
        default: '["3.10.0"]'
        required: false
        type: string

      maven-default:
        default: '3.10.0'
        required: false
        type: string

    secrets:
      SONAR_TOKEN:
        required: false

jobs:

  setup:
    name: Setup
    runs-on: ubuntu-latest

    outputs:
      date-ym: ${{ steps.setup.outputs.date-ym }}

    steps:
      - id: setup
        uses: s4u/.github/actions/setup@master

  verify:
    name: ${{ matrix.os.label }} jdk-${{ matrix.java }}-${{ matrix.java-dist }} mvn-${{ matrix.maven }}
    needs: setup

    runs-on: ${{ matrix.os.name }}
    continue-on-error: ${{ matrix.os.can-fail }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - name: ubuntu-latest
            label: Linux
            can-fail: false
          - name: windows-latest
            label: Windows
            can-fail: false
          - name: macOS-latest
            label: macOS
            can-fail: true
        java: ${{ fromJSON( inputs.java-matrix ) }}
        java-dist: ${{ fromJSON( inputs.java-dist-matrix ) }}
        maven: ${{ fromJSON( inputs.maven-matrix ) }}

    steps:
      - uses: s4u/setup-maven-action@v1.22.0
        with:
          checkout-fetch-depth: 0
          java-version: ${{ matrix.java }}
          java-distribution: ${{ matrix.java-dist }}
          maven-version: ${{ matrix.maven }}
          settings-sonatypeSnapshots: true
          settings-properties: |
            [
              {"sonar.pullrequest.key": "${{ github.event.number }}"},
              {"sonar.pullrequest.base": "${{ github.event.pull_request.base.ref }}"},
              {"sonar.pullrequest.branch": "${{ github.event.pull_request.head.repo.full_name }}/${{ github.event.pull_request.head.ref }}"},
              {"sonar.pullrequest.github.repository": "${{ github.repository }}"},
              {"sonar.scm.revision": "${{ github.event.pull_request.head.sha }}"}
            ]
          cache-prefix: ${{ needs.setup.outputs.date-ym}}-
          cache-path-add: ~/.sonar/cache

      # PRs from forks have no access to secrets,
      # analysis is done by sonar-pr.yml workflow from uploaded artifact
      - name: sonar setup
        id: sonar
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "mvn-args=sonar:sonar -P coverage" >> "$GITHUB_OUTPUT"
            echo "token=true" >> "$GITHUB_OUTPUT"
          else
            echo "mvn-args=-P coverage" >> "$GITHUB_OUTPUT"
            echo "artifact=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: >
          matrix.os.name == 'ubuntu-latest'
          && matrix.java == '17'
          && matrix.java-dist == fromJSON( inputs.java-dist-matrix )[0]
          && matrix.maven == fromJSON( inputs.maven-matrix )[0]
          && github.repository_owner == 's4u'
          && hashFiles('.github/sonar-project.properties') != ''

      - run: mvn --errors --show-version verify ${{ steps.sonar.outputs.mvn-args }}
        env:
          SONAR_TOKEN: ${{ steps.sonar.outputs.token && secrets.SONAR_TOKEN || '' }}

      - name: sonar - store PR number
        if: steps.sonar.outputs.artifact
        run: echo "$PR_NUMBER" > sonar-pr-number.txt
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: sonar - upload artifact
        if: steps.sonar.outputs.artifact
        uses: actions/upload-artifact@v7
        with:
          name: sonar-pr
          retention-days: 1
          if-no-files-found: error
          path: |
            sonar-pr-number.txt
            **/target/classes/
            **/target/test-classes/
            **/target/site/jacoco*/jacoco.xml

  site-test:
    name: Maven Site
    needs: setup

    runs-on: ubuntu-latest

    steps:
      - uses: s4u/setup-maven-action@v1.22.0
        with:
          java-version: ${{ inputs.java-default }}
          java-distribution: ${{ inputs.java-dist-default }}
          maven-version: ${{ inputs.maven-default }}
          settings-sonatypeSnapshots: true
          cache-prefix: ${{ needs.setup.outputs.date-ym }}-maven-site-

      - run: mvn --errors --show-version package site -Dmaven.test.skip=true
 
  verify-ok:
    name: OK
    needs: [ verify, site-test ]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - run: 'true'
        if: needs.verify.result == 'success' && needs.site-test.result == 'success'

      - run: 'false'
        if: needs.verify.result != 'success' || needs.site-test.result != 'success'
